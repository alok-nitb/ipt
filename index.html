<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>IPT Survey Analyser</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007A99'/%3E%3Cpath d='M16 4v24M4 16h24' stroke='white' stroke-width='6'/%3E%3Cpath d='M16 5v7M16 20v7M5 16h7M20 16h7' stroke='%23007A99' stroke-width='1.4' stroke-dasharray='2 1.6'/%3E%3C/svg%3E" />
    <script>
      // set the theme before first paint
      (function () {
        try {
          var t = localStorage.getItem('ipt-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
